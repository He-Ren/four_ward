<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7f5ee" />
    <meta name="description" content="一个会弹一弹的合成小游戏。" />
    <title>合成小红帽</title>
    <link
      rel="icon"
      href="assets/ui/favicon.png"
      type="image/png"
      sizes="64x64"
    />
    <link
      rel="preload"
      href="assets/ui/brand.webp"
      as="image"
      fetchpriority="high"
    />
    <link rel="stylesheet" href="src/merge/styles.css?v=button-align-1" />
    <script defer src="src/merge/boot.js?v=header-1"></script>
  </head>
  <body data-state="loading">
    <div class="app">
      <header class="topbar">
        <a
          class="brand"
          href="index.html"
          aria-label="返回 4Ward 学生节小游戏主页"
        >
          <img
            class="brand-image"
            src="assets/ui/brand.webp"
            width="44"
            height="48"
            alt=""
            loading="eager"
            fetchpriority="high"
          />
          <h1>合成小红帽</h1>
        </a>
        <div class="actions">
          <button id="pause" type="button" disabled>暂停</button
          ><button id="restart" type="button" disabled>
            重新开始 <span aria-hidden="true">↻</span>
          </button>
        </div>
      </header>
      <main class="game-layout">
        <aside class="left-panel">
          <div class="score-card">
            <span class="label">本局得分</span><strong id="score">0</strong>
            <div class="best">个人最佳 <span id="best">0</span></div>
          </div>
        </aside>
        <section class="arena-slot" aria-label="合成游戏">
          <div id="board" class="board">
            <canvas
              id="game"
              tabindex="0"
              aria-label="合成游戏区域。左右方向键瞄准，空格或回车放下物品，P 键暂停。"
            ></canvas>
            <div id="overlay" class="overlay" role="status">
              <div class="overlay-card">
                <span
                  id="overlay-icon"
                  class="overlay-icon"
                  aria-hidden="true"
                ></span>
                <img
                  id="state-image"
                  class="state-image"
                  src="assets/stickers/sticker3.png"
                  alt="暂停"
                  loading="lazy"
                  hidden
                />
                <h2 id="overlay-title">小红帽赶路中</h2>
                <p id="overlay-message">正在加载美术资源</p>
                <button id="overlay-action" type="button" hidden>
                  再玩一次
                </button>
              </div>
            </div>
          </div>
        </section>
        <aside class="right-panel">
          <div class="next-card">
            <span class="label">下一个</span
            ><img id="next-image" alt="下一个物品" hidden />
          </div>
        </aside>
      </main>
      <footer class="credits">
        鸣谢
        <a
          href="https://github.com/YHSome/BigNaiWa"
          target="_blank"
          rel="noopener noreferrer"
          >BigNaiWa</a
        >
        项目提供参考
      </footer>
    </div>
    <dialog
      id="reward-dialog"
      class="reward-dialog"
      aria-labelledby="reward-title"
      aria-describedby="reward-message"
    >
      <img id="reward-image" class="reward-image" alt="本局最高阶图形" />
      <h2 id="reward-title" tabindex="-1">你合成了小红帽！</h2>
      <p id="reward-message">将此页面展示给工作人员以获取奖励</p>
      <button id="reward-continue" type="button">继续游戏</button>
    </dialog>
  </body>
</html>
