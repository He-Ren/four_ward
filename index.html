<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f5ee" />
    <meta
      name="description"
      content="4Ward 学生节小游戏：合成五哥。让相同的图形碰在一起，合成第九阶五哥，向工作人员展示页面领奖。"
    />
    <title>4Ward 学生节 · 小游戏</title>
    <link rel="icon" href="assets/stickers/sticker_logo.png" type="image/png" />
    <link rel="stylesheet" href="src/home/styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="brand" aria-label="4Ward 学生节">
        <span class="brand-mark" aria-hidden="true">伍</span>
        <span>4Ward <small>学生节</small></span>
      </header>
      <main>
        <div class="intro">
          <p class="eyebrow">课间，来玩一局</p>
          <h1>学生节小游戏</h1>
        </div>
        <article class="game-card" aria-labelledby="merge-title">
          <div class="preview" aria-hidden="true">
            <span class="preview-circle"></span>
            <img
              class="sticker sticker-left"
              src="assets/stickers/sticker1_remove_edge.png"
              alt=""
            />
            <img
              class="sticker sticker-right"
              src="assets/stickers/sticker5_remove_edge.png"
              alt=""
            />
            <img class="hero-sticker" src="assets/stickers/wu_ge.png" alt="" />
          </div>
          <div class="game-info">
            <p class="eyebrow">合成小游戏 · 手机 / 电脑均可玩</p>
            <h2 id="merge-title">合成五哥</h2>
            <p class="description">
              选好位置，轻轻放下图形。两个相同的图形相碰，就会合成更高一阶；伴着弹弹的果冻效果，一路合成第九阶的五哥！
            </p>
            <p class="reward">
              合成五哥后，将游戏中的成功页面展示给工作人员，即可领取奖励。
            </p>
            <a class="play-link" href="merge.html"
              >开始合成 <span aria-hidden="true">↗</span></a
            >
          </div>
        </article>
      </main>
      <footer>4Ward 学生节 · 给快乐一点空间</footer>
    </div>
  </body>
</html>
